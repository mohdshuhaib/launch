<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wafy Orbit | Official Student Initiative</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Main Container -->
  <main class="launch-page">

    <section class="card">
      <p class="badge">Official Student Initiative</p>
      <h1 class="title">Wafy Orbit</h1>
      <p class="subtitle">
        Connecting, Empowering, and Aligning Wafy Scholars
      </p>

      <p class="tagline">
        "Rooted in Knowledge, Linked in Unity: Welcome to Wafy Orbit."
      </p>

      <!-- Logo -->
      <div class="logo-shell">
        <div class="pulse-ring"></div>
        <div class="logo-card">
          <img src="orbitlogo.png" alt="Wafy Orbit Logo">
        </div>
      </div>

      <!-- Launch Button -->
      <button class="launch-btn" id="launchBtn">
        <span>🚀 Visit Wafy Orbit</span>
      </button>

      <footer class="footer">
        <p>Wafy Orbit</p>
        <span id="year"></span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
