<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mueenudeen Baqavi Mundamparamb | Official Website</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated Light Background -->
  <div class="bg-wrapper">
    <span class="blob blob1"></span>
    <span class="blob blob2"></span>
    <span class="blob blob3"></span>
    <div class="grid"></div>
  </div>

  <!-- Main Container -->
  <main class="launch-page">

    <section class="card">
      <p class="badge">Official Website</p>
      <h1 class="title">Mueenudeen Baqavi Mundamparamb</h1>
      <p class="subtitle">
        Official Digital Platform & Personal Portal
      </p>

      <p class="tagline">
        Scholarly Insights • Education • Leadership • Guidance
      </p>

      <!-- Logo -->
      <div class="logo-shell">
        <div class="pulse-ring"></div>
        <div class="logo-card">
          <img src="logo.jpeg" alt="Mueenudeen Baqavi Mundamparamb Logo">
        </div>
      </div>

      <!-- Launch Button -->
      <button class="launch-btn" id="launchBtn">
        <span>Launch Official Website</span>
      </button>

      <footer class="footer">
        <p>Mueenudeen Baqavi Mundamparamb</p>
        <span id="year"></span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
